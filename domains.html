<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        #domains {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .domain-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 220px;
            padding: 16px 24px;

            background: rgba(0, 20, 40, 0.75);
            backdrop-filter: blur(10px);

            border: 2px solid rgba(0, 255, 255, 0.35);
            border-radius: 16px;

            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;

            box-shadow:
                0 0 12px rgba(0, 255, 255, 0.15),
                inset 0 0 12px rgba(0, 255, 255, 0.05);

            transition: all 0.25s ease;

            overflow: hidden;
        }

        .domain-btn::before {
            content: "";
            position: absolute;
            inset: 0;

            background: linear-gradient(135deg,
                    rgba(0, 255, 255, 0.15),
                    rgba(0, 100, 255, 0.15));

            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .domain-btn:hover {
            transform: translateY(-4px) scale(1.03);

            border-color: #00ffff;

            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.5),
                0 0 40px rgba(0, 255, 255, 0.2);

            text-shadow: 0 0 10px #00ffff;
        }

        .domain-btn:hover::before {
            opacity: 1;
        }

        .domain-btn span {
            position: relative;
            z-index: 1;
        }

        #domains {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 18px;
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 30px;
            color: white;
            text-shadow:
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #0088ff;
        }
    </style>
</head>

<body>

    <h1>Marty Games Domains</h1>

    <div id="domains">
        <p>Loading domains...</p>
    </div>

    <script>
        fetch("https://cdn.jsdelivr.net/gh/marty-games/marty-games.github.io@main/domains.json")
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById("domains");
                container.innerHTML = "";

                data.urls.forEach(url => {
                    const button = document.createElement("a");
                    button.href = url;
                    button.target = "_blank";
                    button.className = "domain-btn";

                    // Show domain name without https://
                    button.innerHTML = `<span>${new URL(url).hostname}</span>`;
                    container.appendChild(button);
                });
            })
            .catch(error => {
                document.getElementById("domains").innerHTML =
                    "<p>Failed to load domains.json</p>";
                console.error(error);
            });
    </script>
    <style>
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: -2;
        }
    </style>
    <canvas id="bg-canvas"></canvas>

    <script>
        const canvas = document.getElementById("bg-canvas"),
            ctx = canvas.getContext("2d");

        let particles = [];

        const MAX = window.innerWidth < 600 ? 25 : 50;

        const DIST = 100;

        const COLORS = ['#0ff', '#ff0', '#f0f', '#0f0'];

        function init() {

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            particles = [];

            for (let i = 0; i < MAX; i++) particles.push(new Particle());

        }

        class Particle {

            constructor() {

                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.vx = (Math.random() - .5) * 1.2;
                this.vy = (Math.random() - .5) * 1.2;
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];

            }

            update() {

                this.x += this.vx;
                this.y += this.vy;

                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;

            }

            draw() {

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.fillStyle = this.color;
                ctx.fill();

            }

        }

        function connect() {

            for (let a = 0; a < particles.length; a++) {

                for (let b = a + 1; b < particles.length; b++) {

                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let d = Math.sqrt(dx * dx + dy * dy);

                    if (d < DIST) {

                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0,255,255,${0.5-d/(2*DIST)})`;
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();

                    }

                }

            }

        }

        function animate() {

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            connect();

            requestAnimationFrame(animate);

        }

        window.addEventListener("resize", init);

        init();
        animate();
    </script>
</body>

</html>

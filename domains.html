<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain List | Marty Games</title>
    <link rel="icon" type="image/png" href="favicon.ico">

    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: #14161d;
            --text-main: #e3e6eb;
            --text-muted: #8a8d91;
            --primary: #2f80ed;
            --primary-hover: #569aff;
            --border: #232731;
            --radius-md: 6px;
            --radius-sm: 4px;
            --transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: -2;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            z-index: 1;
            background-color: rgba(20, 22, 29, 0.75);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 3rem 2rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 35px;
            font-weight: 500;
        }

        #domains {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            width: 100%;
        }

        .domain-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 1.5rem;
            background-color: var(--surface-color);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: var(--transition);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .domain-btn:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            background-color: rgba(47, 128, 237, 0.05);
            box-shadow: 0 4px 12px rgba(47, 128, 237, 0.15);
        }

        .domain-btn span {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-msg {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
            grid-column: 1 / -1;
            padding: 1rem;
        }
    </style>
</head>

<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <h1>Marty Games</h1>
        <p class="subtitle">Select site mirrors!</p>

        <div id="domains">
            <p class="status-msg">Loading mirror domains...</p>
        </div>
    </div>

    <script>
        fetch("https://cdn.jsdelivr.net/gh/marty-games/marty-games.github.io@main/domains.json")
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById("domains");
                container.innerHTML = "";

                // Fisher-Yates shuffle
                const urls = [...data.urls];
                for (let i = urls.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [urls[i], urls[j]] = [urls[j], urls[i]];
                }

                const selected = urls.slice(0, 4);

                selected.forEach(url => {
                    const button = document.createElement("a");
                    button.href = url;
                    button.target = "_blank";
                    button.className = "domain-btn";

                    button.innerHTML = `<span>${new URL(url).hostname}</span>`;
                    container.appendChild(button);
                });
            })
            .catch(error => {
                document.getElementById("domains").innerHTML =
                    "<p class='status-msg' style='color: #ff4a4a;'>Failed to load central gateway endpoints configurations.</p>";
                console.error(error);
            });
    </script>

    <script>
        const canvas = document.getElementById("bg-canvas"),
            ctx = canvas.getContext("2d");

        let particles = [];
        const MAX = window.innerWidth < 600 ? 25 : 45;
        const DIST = 110;
        const COLORS = ['#2f80ed', '#569aff', '#8a8d91', '#14161d'];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < MAX; i++) particles.push(new Particle());
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.vx = (Math.random() - .5) * 0.8;
                this.vy = (Math.random() - .5) * 0.8;
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particles.length; a++) {
                for (let b = a + 1; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let d = Math.sqrt(dx * dx + dy * dy);

                    if (d < DIST) {
                        opacityValue = 1 - (d / DIST);
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(47, 128, 237, ${opacityValue * 0.15})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            connect();
            requestAnimationFrame(animate);
        }

        window.addEventListener("resize", init);
        init();
        animate();
    </script>
</body>

</html>

    <meta charset="UTF-8">

    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="manifest" href="manifest.json">
    <meta name="description" content="Play unblocked games like Geometry Dash and Gorilla Tag on Marty Games. Fast, free, no downloads—perfect for school or home.">
    
    <script>
        (async function() {
            const fallbackUrls = [
                "https://cdn.jsdelivr.net/gh/",
                "https://fastly.jsdelivr.net/gh/",
                "https://gcore.jsdelivr.net/gh/",
                "https://testingcf.jsdelivr.net/gh/",
                "https://quantil.jsdelivr.net/gh/",
                "https://originfastly.jsdelivr.net/gh/",
                "https://esm.sh/gh/",
                "https://cdn.statically.io/gh/",
                "https://cdn.staticdelivr.com/gh/"
            ];
            const pathSuffix = "marty-games/marty-games.github.io@main/";
            let chosenBase = fallbackUrls[0]; 

            if (location.hostname === "marty-games.github.io") {
                window.location.replace("https://marty-games.neocities.org/" + location.search);
                return; 
            } else {
                for (const url of fallbackUrls) {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 2500);
                        const response = await fetch(url + pathSuffix + "index.html", {
                            method: 'HEAD', mode: 'cors', signal: controller.signal
                        });
                        clearTimeout(timeoutId);
                        if (response.ok) {
                            chosenBase = url;
                            break; 
                        }
                    } catch (e) {}
                }
            }
            const finalBaseUrl = chosenBase + pathSuffix;
            let base = document.querySelector("base") || document.createElement("base");
            base.href = finalBaseUrl;
            if (!document.querySelector("base")) document.head.prepend(base);
        })();
    </script>

    <style>
        :root {
            --bg-color: #f4f6f9;
            --surface-color: #ffffff;
            --text-main: #1c1e21;
            --text-muted: #65676b;
            --primary: #0066cc;
            --primary-hover: #0052a3;
            --border: #e4e6eb;
            --radius-md: 6px;
            --radius-sm: 4px;
            --transition: border-color 0.15s ease, background-color 0.15s ease;
        }

        [data-theme="dark"] {
            --bg-color: #0b0c10;
            --surface-color: #14161d;
            --text-main: #e3e6eb;
            --text-muted: #8a8d91;
            --primary: #2f80ed;
            --primary-hover: #569aff;
            --border: #232731;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: -0.02em;
            cursor: pointer;
        }

        .search-wrapper {
            display: flex;
            gap: 0.5rem;
            flex: 1;
            max-width: 600px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background-color: var(--bg-color);
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
        }

        .btn {
            background-color: var(--surface-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .btn:hover {
            background-color: var(--bg-color);
            border-color: var(--text-muted);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .hero {
            text-align: center;
            padding: 4rem 1.5rem;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border);
        }

        .hero h1 {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }

        .hero p {
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
            font-size: 1rem;
        }

        main {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
            width: 100%;
        }

        .section-header {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .section-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.25rem;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            border-color: var(--primary);
        }

        .card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-bottom: 1px solid var(--border);
            background-color: var(--bg-color);
        }

        .card-content {
            padding: 0.75rem;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.15rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        footer {
            background-color: var(--surface-color);
            border-top: 1px solid var(--border);
            padding: 2rem 1.5rem;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 1rem;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .footer-links a:hover {
            color: var(--text-main);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal {
            background-color: var(--surface-color);
            border-radius: var(--radius-md);
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }

        .modal-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background-color: var(--surface-color);
            z-index: 10;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.25rem;
            cursor: pointer;
            transition: var(--transition);
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
        }

        .modal-close:hover {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .modal-body {
            padding: 1.25rem;
        }

        .settings-group {
            margin-bottom: 1.25rem;
        }
        
        .settings-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .setting-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-color);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        .setting-toggle label {
            margin: 0;
            cursor: pointer;
            text-transform: none;
            color: var(--text-main);
            font-weight: 500;
            letter-spacing: normal;
        }

        .setting-toggle input[type="checkbox"] {
            width: 1.1rem;
            height: 1.1rem;
            cursor: pointer;
            accent-color: var(--primary);
        }

        #game-viewer {
            position: fixed;
            inset: 0;
            background-color: var(--bg-color);
            z-index: 2000;
            display: none;
            flex-direction: column;
        }

        .viewer-header {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .viewer-controls {
            display: flex;
            gap: 0.5rem;
        }

        iframe#game-frame {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                align-items: stretch;
                padding: 1rem;
            }
            .search-wrapper {
                max-width: 100%;
            }
            .hero h1 {
                font-size: 1.75rem;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 0.75rem;
            }
            .card-content {
                padding: 0.5rem;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="nav-container">
            <a href="#" class="logo" onclick="goHome()">Marty Games</a>
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Search games..." oninput="filterGames()">
                <select id="sortSelect" onchange="sortGames()" style="width: auto;">
                    <option value="name">A-Z</option>
                    <option value="recent">Recent</option>
                </select>
            </div>
            <div class="header-actions">
                <button class="btn" onclick="openModal('settingsModal')">Settings</button>
            </div>
        </div>
    </header>

    <div id="homeView">
        <section class="hero">
            <h1>Play Instantly.</h1>
            <p>Fast, lightweight, and completely free. Discover a clean unblocked gaming experience safely on any device.</p>
        </section>
        
        <main>
            <div class="section-header">
                <h2>Browse Library</h2>
                <span id="gameCount" style="color: var(--text-muted); font-size: 0.85rem; font-weight: 500;">Loading...</span>
            </div>
            <div class="grid" id="gameGrid"></div>
        </main>
    </div>

    <div id="game-viewer">
        <div class="viewer-header">
            <div>
                <h3 id="viewer-title" style="margin: 0; font-size: 1.1rem; font-weight: 600;">Game Title</h3>
                <small id="viewer-author" style="color: var(--text-muted); font-weight: 500;">Author</small>
            </div>
            <div class="viewer-controls">
                <button class="btn" onclick="toggleFullscreen()">Fullscreen</button>
                <button class="btn btn-primary" onclick="closeGame()">Close</button>
            </div>
        </div>
        <iframe id="game-frame" allowfullscreen></iframe>
    </div>

    <div class="modal-overlay" id="genericModal" onclick="closeOnBackdrop(event)">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Title</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <div class="modal-overlay" id="settingsModal" onclick="closeOnBackdrop(event)">
        <div class="modal">
            <div class="modal-header">
                <h3>Settings</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-group">
                    <label>Theme Preference</label>
                    <button class="btn" style="width: 100%; text-align: center;" onclick="toggleTheme()">Switch Light / Dark Mode</button>
                </div>
                <div class="settings-group">
                    <label>Launcher System</label>
                    <div class="setting-toggle">
                        <label for="aboutBlankToggle">Launch games inside about:blank</label>
                        <input type="checkbox" id="aboutBlankToggle" onchange="toggleAboutBlank(event)">
                    </div>
                </div>
                <div class="settings-group">
                    <label>Tab Cloaking Title</label>
                    <input type="text" placeholder="e.g. Google Drive" oninput="cloakTab(this.value, null)">
                </div>
                <div class="settings-group">
                    <label>Tab Cloaking Icon URL</label>
                    <input type="text" placeholder="e.g. https://google.com/favicon.ico" oninput="cloakTab(null, this.value)">
                </div>
                <div class="settings-group">
                    <label>Panic Emergency Key ([`] backtick)</label>
                    <input type="text" id="panicUrl" placeholder="Redirect URL" value="https://classroom.google.com">
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="#" onclick="showCredits()">Credits</a>
            <a href="#" onclick="showDMCA()">DMCA</a>
            <a href="#" onclick="showPrivacy()">Privacy</a>
            <a href="#" onclick="showContact()">Contact</a>
        </div>
        <p style="color: var(--text-muted); font-size: 0.8rem;">&copy; 2026 Marty Games. All rights reserved.</p>
    </footer>

    <script>
        let allGames = [];
        let currentActiveGame = null;

        const URL_CONFIG = {
            githack: "https://raw.githack.com/marty-games/",
            jsdelivr: "https://gcore.jsdelivr.net/gh/marty-games/",
            base: "../"
        };

        let useAboutBlank = localStorage.getItem('useAboutBlank') === 'true';
        document.getElementById('aboutBlankToggle').checked = useAboutBlank;

        function toggleAboutBlank(e) {
            useAboutBlank = e.target.checked;
            localStorage.setItem('useAboutBlank', useAboutBlank);
        }

        async function fetchGames() {
            try {
                const endpoints = [
                    "https://cdn.jsdelivr.net/gh/marty-games/zones@main/zones.json",
                    "https://fastly.jsdelivr.net/gh/marty-games/zones@main/zones.json"
                ];
                const res = await fetch(endpoints[0] + "?t=" + Date.now());
                const data = await res.json();
                allGames = data.map(g => ({
                    ...g,
                    cover: g.cover.replace("{GITHACK_URL}", URL_CONFIG.githack).replace("{JSDELIVR_URL}", URL_CONFIG.jsdelivr).replace("{HTML_URL}", URL_CONFIG.base),
                    url: g.url.replace("{GITHACK_URL}", URL_CONFIG.githack).replace("{JSDELIVR_URL}", URL_CONFIG.jsdelivr).replace("{HTML_URL}", URL_CONFIG.base).replace("{COVER_URL}", URL_CONFIG.base)
                }));
                sortGames();
            } catch (err) {
                document.getElementById('gameCount').textContent = "Failed to load library.";
                console.error(err);
            }
        }

        function renderGrid(games) {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            
            document.getElementById('gameCount').textContent = `${games.length} available`;

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => playbook(game);

                const subtitle = Array.isArray(game.special) ? game.special.join(" • ") : (game.special || "Game");

                card.innerHTML = `
                    <img src="${game.cover}" alt="${game.name}" loading="lazy" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMxNDE2MWQiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1zaXplPSIxMiIgZmlsbD0iIzhhOGQ5MSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+TmV3PC90ZXh0Pjwvc3ZnPg=='">
                    <div class="card-content">
                        <div class="card-title">${game.name}</div>
                        <div class="card-subtitle">${subtitle}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function sortGames() {
            const sortVal = document.getElementById('sortSelect').value;
            let sorted = [...allGames];
            
            if (sortVal === 'name') {
                sorted.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortVal === 'recent') {
                sorted.sort((a, b) => b.id - a.id);
            }
            renderGrid(sorted);
        }

        function filterGames() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allGames.filter(g => g.name.toLowerCase().includes(q));
            renderGrid(filtered);
        }

        function playbook(game) {
            currentActiveGame = game;

            if (useAboutBlank) {
                openInAboutBlank(game);
                return;
            }

            const viewer = document.getElementById('game-viewer');
            const frame = document.getElementById('game-frame');
            
            document.getElementById('viewer-title').textContent = game.name;
            document.getElementById('viewer-author').textContent = `by ${game.author || 'Unknown'}`;
            
            if (game.url.startsWith("http")) {
                frame.src = game.url;
            } else {
                fetch(game.url + "?t=" + Date.now())
                    .then(res => res.text())
                    .then(html => {
                        frame.srcdoc = html;
                    })
                    .catch(err => alert("Failed to load game standard frame. Try enabling about:blank launcher in settings."));
            }
            
            viewer.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function openInAboutBlank(game) {
            const win = window.open('about:blank', '_blank');
            win.document.title = document.title; 
            
            let iconLink = document.querySelector("link[rel~='icon']");
            if (iconLink) {
                win.document.head.insertAdjacentHTML('beforeend', `<link rel="icon" href="${iconLink.href}">`);
            }

            if (game.url.startsWith("http")) {
                win.document.write(`
                    <!DOCTYPE html>
                    <html style="margin:0; padding:0; height:100%;">
                    <body style="margin:0; padding:0; height:100%; overflow:hidden; background:#000;">
                        <iframe src="${game.url}" style="width:100%; height:100%; border:none;" allowfullscreen></iframe>
                    </body>
                    </html>
                `);
                win.document.close();
            } else {
                fetch(game.url + "?t=" + Date.now())
                    .then(res => res.text())
                    .then(html => {
                        win.document.open();
                        win.document.write(html);
                        win.document.close();
                    });
            }
        }

        function closeGame() {
            const viewer = document.getElementById('game-viewer');
            const frame = document.getElementById('game-frame');
            viewer.style.display = 'none';
            frame.src = '';
            frame.removeAttribute('srcdoc');
            document.body.style.overflow = '';
            currentActiveGame = null;
        }

        function toggleFullscreen() {
            const frame = document.getElementById('game-frame');
            if (frame.requestFullscreen) frame.requestFullscreen();
            else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
        }

        function goHome() {
            closeGame();
            document.getElementById('searchInput').value = '';
            sortGames();
        }

        function openModal(id, content = null, title = null) {
            document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
            if (id === 'genericModal') {
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalBody').innerHTML = content;
                document.getElementById('genericModal').style.display = 'flex';
            } else {
                document.getElementById(id).style.display = 'flex';
            }
        }

        function closeModal() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
        }

        function closeOnBackdrop(e) {
            if (e.target.classList.contains('modal-overlay')) closeModal();
        }

        function showCredits() {
            openModal('genericModal', `
                <div style="line-height: 1.6; font-size: 0.95rem;">
                    <p style="margin-bottom: 0.75rem;">This site is a pristine fork of gn-math, originally constructed by <a href="https://github.com/genizy" target="_blank" style="color: var(--primary); text-decoration: none;">Genizy</a>, and carefully expanded by <a href="https://github.com/martinmmcyt" target="_blank" style="color: var(--primary); text-decoration: none;">Martin_MMC</a> and <a href="https://github.com/Drag00nKnight999" target="_blank" style="color: var(--primary); text-decoration: none;">Drag00nKnight999</a>.</p>
                    <p style="margin-bottom: 0.75rem;">Game deployment and library catalog contributions from <a href="https://github.com/martinmmcyt" target="_blank" style="color: var(--primary); text-decoration: none;">Martin_MMC</a>, <a href="https://github.com/hackz00" target="_blank" style="color: var(--primary); text-decoration: none;">hackz00</a>, <a href="https://github.com/PokemonHacker1337" target="_blank" style="color: var(--primary); text-decoration: none;">PokemonHacker1337</a>, and community contributors.</p>
                    <p style="margin-bottom: 1rem; padding: 0.5rem; background: var(--bg-color); border-left: 3px solid var(--primary); font-weight: 500;">Overhaul, Optimization & Redesign brilliantly realized by TuffZinc.</p>
                    <p style="color: var(--text-muted); font-size: 0.8rem;">Disclaimer: All game assets, source codes, and trademarks belong explicitly to their respective developers and distribution entities.</p>
                </div>
            `, 'Credits & Authors');
        }

        function showDMCA() {
            openModal('genericModal', `
                <div style="line-height: 1.6; font-size: 0.95rem;">
                    <p>If you are a copyright holder or an agent representing one, and believe any index listing on Marty Games violates your exclusive legal rights, please request immediate deprecation via:</p>
                    <ul style="margin: 1rem 0 1rem 1.25rem;">
                        <li>Opening an issue on our central repository ecosystem.</li>
                        <li>Direct moderation contact through our active communications platform.</li>
                    </ul>
                    <p>Please attach clear documentation substantiating your ownership to guarantee fast tracking.</p>
                </div>
            `, 'DMCA Notice');
        }

        function showPrivacy() {
            openModal('genericModal', `
                <div style="line-height: 1.6; font-size: 0.95rem;">
                    <p>Marty Games operates on complete data minimization. We do not track, profile, harvest, or aggregate your digital footprint or personal metrics.</p>
                    <p style="margin-top: 0.75rem;">Local storage mechanisms are utilized solely to keep track of site preferences (such as dark/light interface state, custom panic settings, and launcher parameters) inside your own browser window space.</p>
                </div>
            `, 'Privacy Policy');
        }

        function showContact() {
            openModal('genericModal', `
                <div style="line-height: 1.6; font-size: 0.95rem;">
                    <p>Connect with core site developers and community members directly:</p>
                    <p style="margin-top: 1rem;"><strong>Discord:</strong> <a href="https://discord.gg/F8kc4FKjnw" target="_blank" style="color: var(--primary); text-decoration: none; font-weight: 600;">Join Official Network</a></p>
                </div>
            `, 'Contact Gateway');
        }

        function toggleTheme() {
            const body = document.body;
            const current = body.getAttribute('data-theme');
            body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        }

        function cloakTab(title, icon) {
            if (title !== null) {
                document.title = title.trim() || 'Marty Games';
            }
            if (icon !== null) {
                let link = document.querySelector("link[rel~='icon']");
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'icon';
                    document.head.appendChild(link);
                }
                link.href = icon.trim() || 'favicon.ico';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === '`') {
                const url = document.getElementById('panicUrl').value || 'https://classroom.google.com';
                window.location.replace(url);
            }
        });

        fetchGames();
    </script>
</body>
</html>

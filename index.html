    <!-- base url -->
    <script>
        (async function() {
            let finalBaseUrl = "";
            if (window.location.hostname === "marty-games.github.io") {
                finalBaseUrl = "https://marty-games.github.io/";
                console.log("Running on primary domain. Setting base directly.");
            } else {
                const fallbackUrls = [
                    "https://cdn.jsdelivr.net/gh/",
                    "https://fastly.jsdelivr.net/gh/",
                    "https://gcore.jsdelivr.net/gh/",
                    "https://testingcf.jsdelivr.net/gh/",
                    "https://quantil.jsdelivr.net/gh/",
                    "https://originfastly.jsdelivr.net/gh/",
                    "https://esm.sh/gh/",
                    "https://cdn.statically.io/gh/",
                    "https://cdn.staticdelivr.com/gh/"
                ];

                const pathSuffix = "marty-games/marty-games.github.io@main/";
                let chosenBase = fallbackUrls[0];

                for (const url of fallbackUrls) {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 2500);

                        const response = await fetch(url + pathSuffix + "index.html", {
                            method: 'HEAD',
                            mode: 'cors',
                            signal: controller.signal
                        });

                        clearTimeout(timeoutId);
                        if (response.ok) {
                            chosenBase = url;
                            break;
                        }
                    } catch (e) {
                        console.warn(`${url} failed, trying next fallback...`);
                    }
                }
                finalBaseUrl = chosenBase + pathSuffix;
            }

            // Apply the base URL to the document
            let base = document.querySelector("base") || document.createElement("base");
            base.href = finalBaseUrl;

            if (!document.querySelector("base")) {
                document.head.prepend(base);
            }

            console.log("Base URL successfully set to: " + finalBaseUrl);
        })();
    </script>

        function refreshZones() {
            searchBar.value = '';
            sortOptions.value = 'name';
            listZones();
        }
        // https://www.jsdelivr.com/tools/purge
        const zonesurls = [
            "https://cdn.jsdelivr.net/gh/marty-games/zones@main/zones.json",
            "https://fastly.jsdelivr.net/gh/marty-games/zones@main/zones.json",
            "https://gcore.jsdelivr.net/gh/marty-games/zones@main/zones.json",
            "https://testingcf.jsdelivr.net/gh/marty-games/zones@main/zones.json",
            "https://originfastly.jsdelivr.net/gh/marty-games/zones@main/zones.json",
            "https://esm.sh/gh/marty-games/zones@main/zones.json",
            "https://cdn.staticdelivr.com/gh/marty-games/zones@main/zones.json",
            "https://cdn.statically.io/gh/marty-games/zones@main/zones.json"
        ];
        let zonesURL = zonesurls[Math.floor(Math.random() * zonesurls.length)];
        let coverURL = "../";
        let htmlURL = "../";
        const jsdelivrURL = "https://gcore.jsdelivr.net/gh/marty-games/";
        const githackURL = "https://raw.githack.com/marty-games/";
        let zones = [];
        async function listZones() {
            let json = null;
            let resolvedURL = ""; // Tracks the working URL configuration

            // Tier 1: Try checking the GitHub API for the latest commit SHA
            try {
                const sharesponse = await fetch("https://api.github.com/repos/marty-games/zones/commits?t=" + Date.now());
                if (sharesponse && sharesponse.status === 200) {
                    const shajson = await sharesponse.json();
                    const sha = shajson[0]?.['sha'];
                    if (sha) {
                        const shaUrl = `../zones@${sha}/zones.json?t=` + Date.now();
                        const response = await fetch(shaUrl);
                        if (response.ok) {
                            json = await response.json();
                            // If running locally or on a domain that routes relative paths, 
                            // we can fall back to using one of your standard CDN arrays for assets
                            resolvedURL = zonesurls[0];
                        }
                    }
                }
            } catch (error) {
                console.warn("Tier 1 (GitHub API SHA strategy) failed, parsing backup...", error);
            }

            // Tier 2: Backup strategy if SHA strategy failed
            if (!json) {
                try {
                    console.log("Attempting Tier 2 backup: ../zones/zones.json");
                    const response = await fetch("../zones/zones.json?t=" + Date.now());
                    if (response.ok) {
                        json = await response.json();
                        resolvedURL = zonesurls[0]; // Map fallback base reference
                    }
                } catch (error) {
                    console.warn("Tier 2 backup failed, parsing fallback array...", error);
                }
            }

            // Tier 3: Last resort fallback loops through zonesurls array from top to bottom
            if (!json) {
                console.log("Attempting Tier 3 fallback checklist...");
                for (const url of zonesurls) {
                    try {
                        const response = await fetch(url + "?t=" + Date.now());
                        if (response.ok) {
                            json = await response.json();
                            resolvedURL = url; // Remember which CDN worked!
                            break;
                        }
                    } catch (error) {
                        console.warn(`${url} failed, checking next in list...`);
                    }
                }
            }

            // Process data if any strategy succeeded
            if (json) {
                // NEW: Handle primary domain override regardless of which Tier succeeded
                if (window.location.hostname === "marty-games.github.io" && resolvedURL) {
                    const match = resolvedURL.match(/^https?:\/\/[^\/]+\/[^\/]+\/marty-games\//);
                    if (match) {
                        const cdnBase = match[0];
                        htmlURL = cdnBase;
                        coverURL = cdnBase;
                        console.log("Primary Domain detected. Bound asset URLs to root CDN: " + cdnBase);
                    }
                }

                try {
                    zones = json;
                    zones[0].featured = true; // always gonna be the discord
                    sortZones();
                    const search = new URLSearchParams(window.location.search);
                    const id = search.get('id');
                    const embed = window.location.hash.includes("embed");
                    if (id) {
                        const zone = zones.find(zone => zone.id + '' == id + '');
                        if (zone) {
                            if (embed) {
                                if (zone.url.startsWith("http")) {
                                    window.open(zone.url, "_blank");
                                } else {
                                    const url = zone.url.replace("{GITHACK_URL}", githackURL).replace("{JSDELIVR_URL}", jsdelivrURL).replace("{HTML_URL}", htmlURL);
                                    fetch(url + "?t=" + Date.now()).then(response => response.text()).then(html => {
                                        document.documentElement.innerHTML = html;
                                        const popup = document.createElement("div");
                                        popup.style.position = "fixed";
                                        popup.style.bottom = "20px";
                                        popup.style.right = "20px";
                                        popup.style.backgroundColor = "#cce5ff";
                                        popup.style.color = "#004085";
                                        popup.style.padding = "10px";
                                        popup.style.border = "1px solid #b8daff";
                                        popup.style.borderRadius = "5px";
                                        popup.style.boxShadow = "0px 0px 10px rgba(0,0,0,0.1)";
                                        popup.style.fontFamily = "Arial, sans-serif";

                                        popup.innerHTML = `Play more games at <a href="https://marty-games.github.io" target="_blank" style="color:#004085; font-weight:bold;">https://marty-games.github.io</a>!`;

                                        const closeBtn = document.createElement("button");
                                        closeBtn.innerText = "✖";
                                        closeBtn.style.marginLeft = "10px";
                                        closeBtn.style.background = "none";
                                        closeBtn.style.border = "none";
                                        closeBtn.style.cursor = "pointer";
                                        closeBtn.style.color = "#004085";
                                        closeBtn.style.fontWeight = "bold";

                                        closeBtn.onclick = () => popup.remove();
                                        popup.appendChild(closeBtn);
                                        document.body.appendChild(popup);
                                        document.documentElement.querySelectorAll('script').forEach(oldScript => {
                                            const newScript = document.createElement('script');
                                            if (oldScript.src) {
                                                newScript.src = oldScript.src;
                                            } else {
                                                newScript.textContent = oldScript.textContent;
                                            }
                                            document.body.appendChild(newScript);
                                        });
                                    }).catch(error => alert("Failed to load zone: " + error));
                                }
                            } else {
                                openZone(zone);
                            }
                        }
                    }
                } catch (error) {
                    console.error(error);
                    container.innerHTML = `Error loading zones content: ${error}`;
                }
            } else {
                container.innerHTML = `Error loading zones: All fallbacks failed.`;
            }
        }

        function sortZones() {
            const sortBy = sortOptions.value;
            if (sortBy === 'name') {
                zones.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortBy === 'id') {
                zones.sort((a, b) => b.id - a.id);
            }
            zones.sort((a, b) => (a.id === -1 ? -1 : b.id === -1 ? 1 : 0));

            displayZones(zones);
        }

        function displayZones(zonesToShow) {
            container.innerHTML = "";

            zonesToShow.forEach((file) => {
                const zoneItem = document.createElement("div");
                zoneItem.className = "zone-item";
                zoneItem.onclick = () => openZone(file);

                const img = document.createElement("img");
                const placeholder = document.createElement("div");
                placeholder.className = "icon-placeholder";
                placeholder.textContent = "No icon";

                // Fallback action if the network fails to load the image link
                img.onerror = () => {
                    img.style.display = "none";
                    placeholder.style.display = "flex";
                };

                // Check if file.cover points to a valid asset configuration
                const hasCover = file.cover && file.cover.trim() !== "" && file.cover !== "{COVER_URL}" && file.cover !== "../";

                if (hasCover) {
                    placeholder.style.display = "none";
                    img.dataset.src = file.cover
                        .replace("{GITHACK_URL}", githackURL)
                        .replace("{JSDELIVR_URL}", jsdelivrURL)
                        .replace("{HTML_URL}", htmlURL);
                    img.alt = file.name;
                    img.loading = "lazy";
                    img.className = "lazy-zone-img";
                    zoneItem.appendChild(img);
                } else {
                    img.style.display = "none";
                    placeholder.style.display = "flex";
                }
                zoneItem.appendChild(placeholder);

                const button = document.createElement("button");
                button.setAttribute("title", file.name);
                button.innerHTML = `
            <div class="zone-name">${file.name}</div>
            <div class="zone-subtitle">
                ${Array.isArray(file.special) ? file.special.join(" • ") : (file.special || "")}
            </div>
        `;

                button.onclick = (event) => {
                    event.stopPropagation();
                    openZone(file);
                };

                zoneItem.appendChild(button);
                container.appendChild(zoneItem);
            });

            if (zonesToShow.length === 0) {
                container.innerHTML = "No results.";
                zoneCount.textContent = "0 available";
                document.getElementById("allSummary").textContent = "All Zones (0)";
            } else {
                zoneCount.textContent = `${zonesToShow.length} available`;
                document.getElementById("allSummary").textContent = `All Zones (${zonesToShow.length})`;
            }

            const lazyImages = document.querySelectorAll('img.lazy-zone-img');
            const imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src;
                        img.classList.remove("lazy-zone-img");
                        observer.unobserve(img);
                    }
                });
            }, {
                rootMargin: "100px",
                threshold: 0.1
            });

            lazyImages.forEach(img => {
                imageObserver.observe(img);
            });
        }

        function filterZones() {
            const query = searchBar.value.toLowerCase();

            if (!query) {
                displayZones(zones);
                return;
            }

            displayZones(
                zones.filter(zone =>
                    zone.name.toLowerCase().includes(query)
                )
            );
        }

        function openZone(file) {
            if (file.url.startsWith("http")) {
                window.open(file.url, "_blank");
            } else {
                const url = file.url
                    .replace("{GITHACK_URL}", githackURL)
                    .replace("{JSDELIVR_URL}", jsdelivrURL)
                    .replace("{HTML_URL}", htmlURL)
                    .replace("{COVER_URL}", coverURL);
                fetch(url + "?t=" + Date.now()).then(response => response.text()).then(html => {
                    if (zoneFrame.contentDocument === null) {
                        zoneFrame = document.createElement("iframe");
                        zoneFrame.id = "zoneFrame";
                        zoneViewer.appendChild(zoneFrame);
                    }
                    zoneFrame.contentDocument.open();
                    zoneFrame.contentDocument.write(html);
                    zoneFrame.contentDocument.close();
                    document.getElementById('zoneName').textContent = file.name;
                    document.getElementById('zoneId').textContent = file.id;
                    document.getElementById('zoneAuthor').textContent = "by " + file.author;
                    if (file.authorLink) {
                        document.getElementById('zoneAuthor').href = file.authorLink;
                    }
                    zoneViewer.style.display = "block";
                    const url = new URL(window.location);
                    url.searchParams.set('id', file.id);
                    history.pushState(null, '', url.toString());
                    zoneViewer.hidden = true;
                }).catch(error => alert("Failed to load zone: " + error));
            }
        }

        function aboutBlank() {
            const newWindow = window.open("about:blank", "_blank");
            let zone = zones.find(zone => zone.id + '' === document.getElementById('zoneId').textContent).url.replace("{GITHACK_URL}", githackURL).replace("{JSDELIVR_URL}", jsdelivrURL).replace("{HTML_URL}", htmlURL);
            fetch(zone + "?t=" + Date.now()).then(response => response.text()).then(html => {
                if (newWindow) {
                    newWindow.document.open();
                    newWindow.document.write(html);
                    newWindow.document.close();
                }
            })
        }

        function closeZone() {
            zoneViewer.hidden = false;
            zoneViewer.style.display = "none";
            zoneViewer.removeChild(zoneFrame);
            const url = new URL(window.location);
            url.searchParams.delete('id');
            history.pushState(null, '', url.toString());
        }

        function downloadZone() {
            let zone = zones.find(zone => zone.id + '' === document.getElementById('zoneId').textContent);
            const url = zone.url
                .replace("{GITHACK_URL}", githackURL)
                .replace("{JSDELIVR_URL}", jsdelivrURL)
                .replace("{HTML_URL}", htmlURL)
                .replace("{COVER_URL}", coverURL);

            fetch(url + "?t=" + Date.now()).then(res => res.text()).then(text => {
                const blob = new Blob([text], {
                    type: "text/plain;charset=utf-8"
                });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = zone.name + ".html";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
        }

                zoneFrame.webkitRequestFullscreen();
            } else if (zoneFrame.msRequestFullscreen) {
                zoneFrame.msRequestFullscreen();
            }
        }

        async function loadMoreLinks() {
            closePopup();
            document.getElementById('popupTitle').textContent = "Alternative Links";
            const popupBody = document.getElementById('popupBody');
            popupBody.innerHTML = "<p>Loading alternative domains...</p>";
            document.getElementById('popupOverlay').style.display = "flex";

            try {
                // Fetch the encoded domains.json file
                const response = await fetch('./domains.json?t=' + Date.now());
                if (!response.ok) throw new Error("Could not retrieve domain list.");

                const data = await response.json();

                // Read from the "urls" array inside the object
                const domains = data.urls;

                if (!Array.isArray(domains) || domains.length === 0) {
                    popupBody.innerHTML = "<p>No links found in domains.json.</p>";
                    return;
                }

                // Shuffle domains and grab up to 4 items
                const shuffled = [...domains].sort(() => 0.5 - Math.random());
                const selectedLinks = shuffled.slice(0, 4);

                // Build a clean grid using your existing .settings-button styles
                let htmlContent = '<div class="settings-grid" style="margin-top: 10px; display: flex; flex-direction: column; gap: 10px;">';
                selectedLinks.forEach(url => {
                    // Extract just the hostname cleanly for a shorter display name
                    let displayName = url;
                    try {
                        const parsed = new URL(url);
                        displayName = parsed.hostname;
                        // Clean up common subdomains for a cleaner button look
                        if (displayName.startsWith('www.')) displayName = displayName.substring(4);
                    } catch (e) {}

                    htmlContent += `
                        <a href="${url}" target="_blank" rel="noopener noreferrer" id="settings-button" style="display: block; text-decoration: none; text-align: center; line-height: 1.5;">
                            🌐 ${displayName}

                htmlContent += '</div>';

            } catch (error) {
                console.error(error);
                popupBody.innerHTML = `<p style="color: red;">Error fetching alternative links: ${error.message}</p>`;

        function isBlockedDomain(url) {
            // Safety check: ensure url is present and is a string
            if (!url || typeof url !== 'string') return false;

            try {
                // Fallback to a dummy base if location.origin is invalid/null
                const base = (location.origin && location.origin !== 'null') ? location.origin : 'https://localhost';
                const domain = new URL(url, base).hostname + "/";
                return schoolList.some(school => domain.includes(school));
            } catch (e) {

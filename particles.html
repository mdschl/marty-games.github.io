        <style>
            #bg-canvas {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: black;
                z-index: -2;
            }
        </style>
        <canvas id="bg-canvas"></canvas>

        <script>
            const canvas = document.getElementById("bg-canvas"),
                ctx = canvas.getContext("2d");

            let particles = [];

            const MAX = window.innerWidth < 600 ? 25 : 50;

            const DIST = 100;

            const COLORS = ['#0ff', '#ff0', '#f0f', '#0f0'];

            function init() {

                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                particles = [];

                for (let i = 0; i < MAX; i++) particles.push(new Particle());

            }

            class Particle {

                constructor() {

                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 3 + 1;
                    this.vx = (Math.random() - .5) * 1.2;
                    this.vy = (Math.random() - .5) * 1.2;
                    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];

                }

                update() {

                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x > canvas.width) this.x = 0;
                    if (this.x < 0) this.x = canvas.width;
                    if (this.y > canvas.height) this.y = 0;
                    if (this.y < 0) this.y = canvas.height;

                }

                draw() {

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 8;
                    ctx.fillStyle = this.color;
                    ctx.fill();

                }

            }

            function connect() {

                for (let a = 0; a < particles.length; a++) {

                    for (let b = a + 1; b < particles.length; b++) {

                        let dx = particles[a].x - particles[b].x;
                        let dy = particles[a].y - particles[b].y;
                        let d = Math.sqrt(dx * dx + dy * dy);

                        if (d < DIST) {

                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(0,255,255,${0.5-d/(2*DIST)})`;
                            ctx.moveTo(particles[a].x, particles[a].y);
                            ctx.lineTo(particles[b].x, particles[b].y);
                            ctx.stroke();

                        }

                    }

                }

            }

            function animate() {

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach(p => {
                    p.update();
                    p.draw();
                });

                connect();

                requestAnimationFrame(animate);

            }

            window.addEventListener("resize", init);

            init();
            animate();
        </script>
